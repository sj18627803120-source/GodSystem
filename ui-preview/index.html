<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>God System · 终端预览</title><style>body{margin:0;background:#0a100e;color:#cad6cd;font:14px "Microsoft YaHei",sans-serif}header{padding:18px 24px;border-bottom:1px solid #293b31;display:flex;gap:12px;align-items:center;flex-wrap:wrap}b{letter-spacing:2px;margin-right:22px}button{background:#14221c;color:#abc3b4;border:1px solid #354c3f;padding:8px 16px;cursor:pointer}button.active{border-color:#85bea0;color:#d8eddf}p{margin:15px 24px;color:#889c90}main{padding:0 16px 20px;overflow:auto}img{display:block;max-width:100%;margin:auto;border:1px solid #2b4033}</style><header><b>GOD SYSTEM / TERMINAL</b><button onclick="show('tasks',this)">任务</button><button onclick="show('shop',this)">商店</button><button onclick="show('bank',this)">银行</button><button onclick="show('equipment',this)">装备</button><button onclick="show('home',this)">家园</button><button onclick="show('traits',this)">特质</button><button onclick="show('attribute',this)">技能</button><button onclick="show('upgrades',this)">升级</button><button onclick="show('companion',this)">机械同伴</button><button onclick="show('rangeRecycle',this)">回收</button><button onclick="show('info',this)">手册</button><button onclick="show('settings',this)">设置</button></header><p>由正式目录 Lua 绘图指令生成的离线预览；使用示例数据与近似字体度量。游戏内最终效果仍需验证。</p><main><img id="screen" src="tasks.svg"></main><script>function show(page,button){document.querySelector('#screen').src=page+'.svg';document.querySelectorAll('button').forEach(x=>x.classList.remove('active'));button.classList.add('active')}document.querySelector('button').classList.add('active')</script></html>
