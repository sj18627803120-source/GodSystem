AdminSetting_EnableEquipmentSplash_Desc: "Independent sandbox toggle for the bound melee splash effect; enabled by default. On the first zombie hit of each swing, damage the nearest up to five other zombies within about two tiles on the same floor. Direct hits from that swing are excluded. Walls and doors do not block it. Each level adds 10%% of the weapon's average minimum/maximum base damage; hit-specific modifiers are not included. Disabling hides the enhancement entry and pauses the effect while preserving its level."
