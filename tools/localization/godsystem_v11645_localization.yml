AdminSetting_AutoShopListOnlyMinCost: "仅上架最低费用"
AdminSetting_AutoShopListOnlyMinCost_Desc: "仅上架功能最低收取的系统币数量，默认 50。"
AdminSetting_EconomyConversionSafetyMargin: "转换安全余量"
AdminSetting_EconomyConversionSafetyMargin_Desc: "确定性拆包产物的回收总价额外增加该比例，作为商城安全底价；默认 0.10，即 10%%。"
AdminSetting_EconomyUnknownDynamicOutputCount: "未知动态产出保障数量"
