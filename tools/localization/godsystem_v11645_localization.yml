AdminSetting_EnableEquipment: "启用装备系统"
AdminSetting_EnableEquipment_Desc: "关闭后禁止绑定和培养，并恢复已识别装备的普通属性；档案不删除。"
AdminSetting_EquipmentMaxSlots: "装备槽数量上限"
AdminSetting_EquipmentMaxSlots_Desc: "初始 1 槽；完成 25、50 次任务解锁第 2、3 槽，后续门槛翻倍。调低不删除已解锁槽。"
AdminSetting_EquipmentSlotTaskBase: "第 2 装备槽解锁任务量"
AdminSetting_EquipmentSlotTaskBase_Desc: "累计成功完成并领取奖励的任务次数。第 1 槽免费；默认第 2 槽需 25 次。设为 0 时，配置上限内的全部槽位立即解锁；不会消耗任务次数，已解锁槽不会重新锁定。"
AdminSetting_EquipmentSlotTaskMultiplier: "后续装备槽任务量倍率"
AdminSetting_EquipmentSlotTaskMultiplier_Desc: "从第 3 槽开始，每个槽的门槛为上一规则的倍率次方：向上取整（第 2 槽任务量 × 倍率^(槽位-2)）。默认 2，即 25、50、100……；最小 1。降低门槛会立即补解锁。"
AdminSetting_EnableEquipmentFreeze: "启用装备冻结强化（实验）"
AdminSetting_EnableEquipmentFreeze_Desc: "仅本人正在使用的已绑定近战装备可培养和触发。每次真实挥击（挥空也算）使本人同楼层、半径范围内僵尸减速；推搡、踩踏、徒手和枪械不触发。关闭时隐藏入口、停止新效果并恢复现有效果，已培养等级保留。默认开启；若与僵尸动画 MOD 冲突可关闭。"
AdminSetting_EquipmentFreezeRadius: "冻结范围（格）"
AdminSetting_EquipmentFreezeRadius_Desc: "以玩家为中心，只作用同一楼层内的僵尸；默认 3 格。不检查墙和门。范围越大，需要检查的附近已加载格子越多；不会扫描全地图。"
AdminSetting_EquipmentFreezeSeconds: "冻结持续时间（现实秒）"
AdminSetting_EquipmentFreezeSeconds_Desc: "默认 3 个现实秒；再次触发会刷新持续时间。不同来源取最强减速且不叠加，较弱效果也只续时。"
AdminSetting_EquipmentFreezeVisuals: "显示冻结淡蓝标记"
AdminSetting_EquipmentFreezeVisuals_Desc: "受影响僵尸首次冻结或强度变化时显示约 0.35 秒淡蓝标记；每个视口最多绘制 32 个，视觉上限不限制实际效果目标。"
AdminSetting_EquipmentMaxLevel: "属性强化等级上限"
AdminSetting_EquipmentMaxLevel_Desc: "各属性独立从 Lv0 开始；降低配置不会删除已有等级。"
AdminSetting_EquipmentGrowthPercent: "装备每级属性增幅（%%）"
AdminSetting_EquipmentGrowthPercent_Desc: "所有装备强化属性共用此值，默认 10%%，可设 0.01～100。Lv0 为基础值；每级固定增加基础值的 X%%，不复利。后坐力延迟每级减少基础值的 X%%，最低 1；精准最高 100，整数参数取整。修改后已有装备按原等级重新计算，不清空培养数据。"
AdminSetting_EquipmentBaseCost: "强化基础费用"
AdminSetting_EquipmentBaseCost_Desc: "强化费用为向上取整（基础费用 ×（当前等级 + 1）的费用指数次方）；Lv0 首次强化默认 100 系统币。"
AdminSetting_EquipmentCostExponent: "强化费用指数"
AdminSetting_EquipmentCostExponent_Desc: "控制强化费用随等级递增的速度。"
AdminSetting_EquipmentBaseChance: "强化基础成功率（%%）"
AdminSetting_EquipmentBaseChance_Desc: "未追加系统币时的初始成功率；最终统一使用万分比精度。"
AdminSetting_EquipmentChanceDecay: "强化成功率衰减倍率"
AdminSetting_EquipmentChanceDecay_Desc: "每增加一级乘此倍率，最终不低于成功率下限。"
AdminSetting_EquipmentChanceFloor: "强化成功率下限（%%）"
AdminSetting_EquipmentChanceFloor_Desc: "必须不高于基础成功率；无效配置将暂停装备交易。"
AdminSetting_EquipmentBoostCost: "每追加 1 个百分点的费用"
AdminSetting_EquipmentBoostCost_Desc: "按目标与自然成功率的差额收费，支持不足 1 个百分点并向上取整到系统币；不超过 100%%，失败仍扣除强化和追加费用。"
AdminSetting_EquipmentRepairCost: "装备修理费用"
AdminSetting_EquipmentRepairCost_Desc: "恢复主体、支持的头部耐久和原版允许的最高锋利度。满状态不收费。"
AdminSetting_EquipmentRetrieveMultiplier: "装备找回售价倍率"
AdminSetting_EquipmentRetrieveMultiplier_Desc: "找回费为基础武器当前商城单价 × 倍率。不恢复配件、弹药；旧代实体失效但不删除。"
