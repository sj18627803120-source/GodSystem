AdminSetting_EnableUtilityGenerator: "启用水电一体机"
AdminSetting_EnableUtilityGenerator_Desc: "总开关。设备启动时同时尝试供水供电，停机时两项都停止；关闭总开关后隐藏新的放置入口，已购买设备与水电账户余额保留。"
AdminSetting_EnableUtilityGeneratorWater: "启用水电一体机供水"
AdminSetting_EnableUtilityGeneratorWater_Desc: "启用后，无论公共供水状态，都会为接入原版管道接口的固定设施补充水，并允许从设备接水或饮水；按配置价格预扣，未用水量停机或搬走时退款。默认开启。"
AdminSetting_EnableUtilityGeneratorElectricity: "启用水电一体机供电"
AdminSetting_EnableUtilityGeneratorElectricity_Desc: "启用后，无论公共电力状态，原生发电机都会运行；按燃料实际消耗计费，未使用的预存燃料停机或搬走时退款。默认开启。"
AdminSetting_UtilityGeneratorWaterPricePer100L: "水电一体机每 100 升水价"
AdminSetting_UtilityGeneratorWaterPricePer100L_Desc: "设备供出的水按每 100 升收取系统币。默认 20 币；公共供水正常时也计费，调价只影响后续补水。"
AdminSetting_UtilityGeneratorElectricityPricePerFuelUnit: "水电一体机每单位燃料价格"
AdminSetting_UtilityGeneratorElectricityPricePerFuelUnit_Desc: "设备按原版发电机每消耗 1 个燃料单位收取系统币。默认 5 币；公共电力正常时也运行，调价只影响后续预存燃料。"
