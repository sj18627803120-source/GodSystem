Companion_EffectCorrosionDetail: "普通攻击命中后持续3秒，每秒造成该次直击伤害的10%。重复命中刷新持续时间、保留下一跳时间并采用较高伤害。"
Companion_EffectMark: "弱点锁定"
Companion_EffectMarkDetail: "普通攻击命中后标记目标6秒，后续同伴直击伤害提高20%；首次施加标记的命中不享受加成。"
Companion_EffectChain: "电弧连锁"
Companion_EffectChainDetail: "普通攻击命中后，对目标3米内最近的1个合法副目标造成直击伤害50%的伤害。副伤害不会继续触发特效。"
Companion_EffectBlast: "过载爆裂"
Companion_EffectBlastDetail: "普通攻击命中后，对目标2米内最多4个唯一副目标造成直击伤害25%的伤害；连锁目标占用1个名额且不会重复受伤。"
