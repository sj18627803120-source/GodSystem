AdminSetting_BankLoanOverduePenaltyMaxRate: "逾期罚息封顶"
AdminSetting_BankLoanOverduePenaltyMaxRate_Desc: "逾期罚息最多按本金多少比例封顶，默认 0.5。"
AdminSetting_BankLoanBankruptcyGraceHours: "破产宽限小时"
AdminSetting_BankLoanBankruptcyGraceHours_Desc: "贷款逾期超过多少游戏小时触发信用破产，默认 240。"
AdminSetting_BankLoanFreezeHours: "破产冻结小时"
