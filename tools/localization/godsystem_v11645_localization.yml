Storage_Main_Separate: "系统仓库与穿戴式系统空间终端完全独立。"
Storage_Main_SeparateDetail: "物品始终真实存放在木箱、柜子、货架、冰箱和冰柜中；核心宿主和普通家具都可参与索引、分类和搬运。"
Storage_Main_Place: "把仓库核心安装进一件已标记的固定网络家具。"
Storage_Main_PlaceDetail: "家具无需清空，原容量与已有物品保持不变；核心宿主同时是仓库入口和普通网络容器。"
Storage_Main_Link: "开启连接模式后，右键场景箱柜标记为网络容器。"
Storage_Main_LinkDetail: "同层上下左右紧贴或同格堆叠会自动连通；斜角、隔层、车辆和便携容器不连接。"
Storage_Main_Safety: "家具被拆除、摧毁或移动后，网络标记随原对象消失。"
Storage_Main_SafetyDetail: "重新放下的新家具必须重新标记；系统不会按坐标绑定替代物，也不会从旧索引生成物品。"
Storage_Manual_Title: "使用说明"
Storage_Manual_Detail: "1. 第一次免费领取仓库核心；遗失后找回固定花费 2000 系统币。\n2. 开启连接模式，靠近固定场景箱柜并右键标记为网络容器。\n3. 背包中带着核心右键任意已标记家具，选择“安装仓库核心”；非空及多储物格家具均可安装。\n4. 核心宿主既是仓库入口，也是正常网络容器，原容量、已有物品、索引和分类路由全部保留。\n5. 仓库窗口左侧选择人物主背包、穿戴或手持容器、钥匙圈，中间选择网络物品，右侧查看详情和具体实例。\n6. 两侧支持 Ctrl 增减选择、Shift 连选；右键单组选一个/一半/全部，多选会处理全部选中物品。\n7. “存入全部”只处理当前人物容器直属物品，自动跳过装备、手持、快捷栏、收藏、钥匙及受保护系统物品。\n8. 连接模式下绿色表示核心宿主、蓝色表示已连通普通容器、红色表示已标记但未连通容器；同格家具使用稳定编号。\n9. 右键核心宿主可打开仓库或免费取回核心；取回只移除核心身份，家具继续保留网络标记、容量和物品。\n10. 区域卸载不会丢失标记或核心状态；拆除、移动或替换家具后连接失效，重新放下后需要重新标记。\n11. 本版仅支持靠近核心宿主存取，不支持远程、车辆容器、拖拽存取或合成接入。"
