AdminSetting_EnableUtilityGenerator: "Enable Utility Generator"
AdminSetting_EnableUtilityGenerator_Desc: "Master switch. When disabled, the device stops supplying water and power and new placement is hidden; owned devices and their balance remain."
AdminSetting_EnableUtilityGeneratorWater: "Enable Utility Generator Water"
AdminSetting_EnableUtilityGeneratorWater_Desc: "When enabled, supply fixed objects with the vanilla piped-water interface only after public water is shut off. Cost is reserved per 100 L; unused prepaid water is refunded when stopped or picked up. Enabled by default."
AdminSetting_EnableUtilityGeneratorElectricity: "Enable Utility Generator Electricity"
AdminSetting_EnableUtilityGeneratorElectricity_Desc: "When enabled, the native generator supplies power only after public electricity is shut off. Fuel is prepaid and billed by actual consumption; unused reserved fuel is refunded when stopped or picked up. Enabled by default."
AdminSetting_UtilityGeneratorWaterPricePer100L: "Utility Generator Water Price per 100 L"
AdminSetting_UtilityGeneratorWaterPricePer100L_Desc: "System coins charged for each 100 L supplied after public water is shut off. Default: 20 coins. Price changes affect future refills only."
AdminSetting_UtilityGeneratorElectricityPricePerFuelUnit: "Utility Generator Electricity Price per Fuel Unit"
AdminSetting_UtilityGeneratorElectricityPricePerFuelUnit_Desc: "System coins charged for each vanilla generator fuel unit consumed after public electricity is shut off. Default: 5 coins. Price changes affect future fuel reserves only."
