AdminSetting_EnableUtilityGenerator: "Enable Utility Generator"
AdminSetting_EnableUtilityGenerator_Desc: "Master switch. Starting the device attempts both water and power supply; stopping ends both. Disabling hides new placement while existing devices and both account balances remain."
AdminSetting_EnableUtilityGeneratorWater: "Enable Utility Generator Water"
AdminSetting_EnableUtilityGeneratorWater_Desc: "When enabled, supplies fixed vanilla piped-water fixtures and permits filling or drinking regardless of public water. Water is prepaid; unused water is refunded on stop or pickup. Enabled by default."
AdminSetting_EnableUtilityGeneratorElectricity: "Enable Utility Generator Electricity"
AdminSetting_EnableUtilityGeneratorElectricity_Desc: "When enabled, the native generator runs regardless of public electricity. Fuel is prepaid and billed by actual consumption; unused fuel is refunded on stop or pickup. Enabled by default."
AdminSetting_UtilityGeneratorWaterPricePer100L: "Utility Generator Water Price per 100 L"
AdminSetting_UtilityGeneratorWaterPricePer100L_Desc: "System coins charged for each 100 L supplied, even while public water is active. Default: 20 coins. Price changes affect future refills only."
AdminSetting_UtilityGeneratorElectricityPricePerFuelUnit: "Utility Generator Electricity Price per Fuel Unit"
AdminSetting_UtilityGeneratorElectricityPricePerFuelUnit_Desc: "System coins charged for each vanilla generator fuel unit consumed, even while public electricity is active. Default: 5 coins. Price changes affect future fuel reserves only."
